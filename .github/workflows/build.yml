name: Deploy Linux Mint 22 Desktop

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy-mint:
    runs-on: ubuntu-latest
    timeout-minutes: 180 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Restore the pre-installed system snapshot cache if it exists
      - name: Restore Mint Desktop Cache
        id: cache-mint
        uses: actions/cache@v4
        with:
          path: |
            /opt/mint-snapshot
          key: linux-mint-22-cinnamon-v1

      - name: Install Real Linux Mint 22 Cinnamon Desktop
        if: steps.cache-mint.outputs.cache-hit != 'true'
        run: |
          echo "=================================================="
          echo "🚀 FRESH INSTALL: UPGRADING TO LINUX MINT 22..."
          echo "=================================================="
          sudo apt-get update
          
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            software-properties-common \
            tigervnc-standalone-server \
            tigervnc-common \
            dbus-x11 \
            novnc \
            websockify \
            firefox \
            cinnamon-desktop-environment

          echo "runner:MyScreenPass123" | sudo chpasswd

          # Create a compressed backup of the system files for future runs
          sudo mkdir -p /opt/mint-snapshot
          sudo tar -czf /opt/mint-snapshot/mint-snapshot.tar.gz /usr /etc /var/lib/dpkg /var/lib/apt /home/runner

      # 2. Unpack the snapshot archive back into the system if cache was found
      - name: Restore System Snapshot to Runner
        if: steps.cache-mint.outputs.cache-hit == 'true'
        run: |
          echo "=================================================="
          echo "⚡ RESTORING FROM PREVIOUS SNAPSHOT CACHE..."
          echo "=================================================="
          sudo tar -xzf /opt/mint-snapshot/mint-snapshot.tar.gz -C / --overwrite

      - name: Initialize VNC Display & Password Configuration
        run: |
          mkdir -p ~/.vnc
          echo "MySecurePass123" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd
          touch ~/.Xauthority
          
          cat << 'EOF' > ~/.vnc/xstartup
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          export XDG_CURRENT_DESKTOP="X-Cinnamon"
          export XDG_MENU_PREFIX="cinnamon-"
          
          if [ -x /usr/bin/dbus-launch ]; then
            exec dbus-launch --exit-with-session cinnamon-session
          else
            exec cinnamon-session
          fi
          EOF
          chmod +x ~/.vnc/xstartup

      - name: Fire Up Graphical Display Server
        run: |
          vncserver -kill :1 || true
          rm -f /tmp/.X11-unix/X1 || true
          rm -f /tmp/.X1-lock || true

          vncserver :1 -geometry 1280x720 -depth 24 -localhost no -xstartup ~/.vnc/xstartup
          sleep 7
          websockify --web=/usr/share/novnc 6901 localhost:5901 &
          sleep 5

      - name: Launch Secure Cloudflare Tunnel
        run: |
          echo "=================================================="
          echo "🔑 VNC PASSWORD: MySecurePass123"
          echo "💻 SCREEN LOCK PASSWORD: MyScreenPass123"
          echo "=================================================="
          
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          cloudflared tunnel --url http://127.0.0.1:6901 > cf.log 2>&1 &
          sleep 20
          
          echo "🌐 COPY AND PASTE THIS LINK INTO YOUR BROWSER:"
          grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cf.log || echo "Tunnel delayed."
          echo "=================================================="
          
          # Keep your remote Ubuntu workstation active for 30 minutes (1800 seconds)
          sleep 1800
